name: Create ReverseTools Release

on:
  push:
    branches:
      - 'runtime-upload/**'
    paths:
      - 'staged-runtime/.ready'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Read metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          META='staged-runtime/ReverseToolsRuntime.bundle.json'
          test -f "$META"
          REVISION="$(jq -r '.revision' "$META")"
          test "${#REVISION}" -eq 64
          TAG="runtime-reverse-tools-${REVISION:0:12}"
          ARCHIVE_SHA="$(jq -r '.archive_sha256' "$META")"
          ARCHIVE_BYTES="$(jq -r '.archive_bytes' "$META")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$ARCHIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "archive_bytes=$ARCHIVE_BYTES" >> "$GITHUB_OUTPUT"

      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REVISION: ${{ steps.meta.outputs.revision }}
          ARCHIVE_SHA: ${{ steps.meta.outputs.archive_sha }}
          ARCHIVE_BYTES: ${{ steps.meta.outputs.archive_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="CodexApp Reverse Tools Runtime update.

Revision: $REVISION
radare2: 6.2.4
Expected asset: ReverseToolsRuntime.tar.gz
Expected bytes: $ARCHIVE_BYTES
Archive SHA256: $ARCHIVE_SHA"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target main               --title "$TAG"               --notes "$NOTES"
          fi

      - name: Upload bundle metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG"             staged-runtime/ReverseToolsRuntime.bundle.json             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Verify release shell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets             --jq '{tag:.tagName,assets:[.assets[].name]}'
