name: Transfer Runtime Assets

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Private source repository
        required: true
        default: susu123oss/Codex-MT
      source_tag:
        description: Source runtime release tag
        required: true
      target_tag:
        description: Target runtime release tag
        required: true

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download source release assets
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          mkdir -p runtime
          gh release download "$SOURCE_TAG" \
            --repo "$SOURCE_REPO" \
            --pattern 'TheosRuntime.tar.gz.part*' \
            --pattern 'TheosRuntime.bundle.json' \
            --dir runtime
          ls -lh runtime

      - name: Ensure target release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          if ! gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TARGET_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Theos Runtime $TARGET_TAG" \
              --notes "CodexApp public Theos Runtime assets."
          fi

      - name: Upload assets to public release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          gh release upload "$TARGET_TAG" runtime/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
